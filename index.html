<!DOCTYPE html>
<html>
<head>
    <title>My Chatbot</title>

    <style>
        body {
            font-family: Arial;
            max-width: 500px;
            margin: 30px auto;
        }

        #chat {
            border: 1px solid #ccc;
            height: 400px;
            padding: 15px;
            overflow-y: auto;
        }

        .message {
            margin: 10px 0;
        }

        .user {
            text-align: right;
        }

        .bot {
            text-align: left;
        }

        #inputArea {
            display: flex;
            margin-top: 10px;
        }

        #message {
            flex: 1;
            padding: 10px;
        }

        button {
            padding: 10px 15px;
        }
    </style>
</head>

<body>

    <h2>My Chatbot 🤖</h2>

    <div id="chat"></div>

    <div id="inputArea">
        <input id="message" placeholder="Type a message...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>

        async function sendMessage() {

    let input = document.getElementById("message");
    let text = input.value.trim();

    if (text === "") return;

    // Ipakita ang message ng user
    addMessage("You", text, "user");

    // Linisin ang input
    input.value = "";

    try {

        const response = await fetch(
            "https://mychatbot-ct9m.onrender.com/chat",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message: text
                })
            }
        );

        const data = await response.json();

        if (response.ok) {
            addMessage("Bot", data.reply, "bot");
        } else {
            addMessage("Bot", "May problema sa server. 😅", "bot");
        }

    } catch (error) {

        console.error(error);

        addMessage(
            "Bot",
            "Hindi ko makontak ang AI server. 😅",
            "bot"
        );
    }
}
        function addMessage(sender, text, className) {

            let chat = document.getElementById("chat");

            chat.innerHTML += `
                <div class="message ${className}">
                    <strong>${sender}:</strong> ${text}
                </div>
            `;

            chat.scrollTop = chat.scrollHeight;
        }

    </script>

</body>
</html>
